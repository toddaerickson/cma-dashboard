name: Monthly dashboard refresh (ARCHIVED)

# Schedule disabled — pipeline archived in favor of credit_signal.py.
# Keep workflow_dispatch so it can still be run manually if needed.
on:
  # schedule:
  #   - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache HuggingFace weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-2p5-200m
          restore-keys: |
            hf-timesfm-

      - name: Run dashboard
        run: python src/dashboard.py

      - name: Validate outputs
        run: |
          for f in docs/index.html docs/cma_latest.csv docs/history.csv; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty"
              exit 1
            fi
          done
          size=$(wc -c < docs/index.html)
          if [ "$size" -lt 5000 ]; then
            echo "ERROR: index.html is suspiciously small (${size} bytes)"
            exit 1
          fi
          for fig in signal_tree signal_history cma allocation; do
            test -f "docs/figures/${fig}.png" || { echo "ERROR: ${fig}.png missing"; exit 1; }
          done
          echo "All outputs validated."

      - name: Commit refreshed dashboard
        run: |
          git config user.name "cma-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
